# Render Blueprint: בסיס נתונים + שרת + לקוח, בהתקנה אחת (New → Blueprint).
databases:
  - name: readingspot-db
    plan: free
    region: frankfurt

services:
  # שרת ה-API (Docker, מתוך ה-repository הזה)
  - type: web
    name: readingspot-yehudit-api
    runtime: docker
    plan: free
    region: frankfurt
    envVars:
      - key: Database__Provider
        value: Postgres
      - key: ConnectionStrings__Default
        fromDatabase:
          name: readingspot-db
          property: connectionString
      - key: Jwt__Key
        generateValue: true
      - key: Cors__Origins__0
        value: https://readingspot-yehudit.onrender.com

  # לקוח React (מתוך ה-repository של הלקוח)
  - type: web
    name: readingspot-yehudit
    runtime: static
    repo: https://github.com/yehudit-steinhaus/readingSpot-client
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
